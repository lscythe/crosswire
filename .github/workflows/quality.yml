name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, commits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/gateway/go.mod
          cache-dependency-path: services/gateway/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: bash scripts/check-quality-gates.sh
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            pnpm exec commitlint --last --verbose
          else
            pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          fi

  browser:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and start stack
        run: docker compose --env-file .env.example -f infra/compose/docker-compose.yml up -d --build --wait --wait-timeout 120
      - name: Bootstrap and verify account flow
        run: bash scripts/check-foundation.sh
      - name: Verify gateway access restrictions and quotas
        run: |
          bash scripts/check-password-access.sh
          docker compose --env-file .env.example -f infra/compose/docker-compose.yml exec -T postgres psql -U crosswire -d crosswire -v ON_ERROR_STOP=1 < tests/sql/public-connection-limits.sql
      - name: Start deterministic provider
        run: |
          docker compose --env-file .env.example -f infra/compose/docker-compose.yml cp tests/fixtures/provider.cjs web:/tmp/provider.cjs
          docker compose --env-file .env.example -f infra/compose/docker-compose.yml exec -d web node /tmp/provider.cjs
          docker compose --env-file .env.example -f infra/compose/docker-compose.yml exec -T web node -e 'const wait = async () => { for (let i = 0; i < 30; i++) { try { if ((await fetch("http://localhost:4100/v1/models")).ok) return; } catch {} await new Promise(r => setTimeout(r, 1000)); } process.exit(1); }; wait();'
      - name: Browser tests
        env:
          TEST_PROVIDER_URL: http://web:4100/v1
        run: pnpm test:e2e
      - name: Container logs
        if: failure()
        run: docker compose --env-file .env.example -f infra/compose/docker-compose.yml logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.example -f infra/compose/docker-compose.yml down -v
